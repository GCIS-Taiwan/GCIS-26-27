<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>About Glen Pamment - Grade 2</title>
    <style>
        /* =========================================================
           COLOR PALETTE & VARIABLES
           ========================================================= */
        :root {
            /* Light Theme Colors */
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --nav-bg: #ffffff;
            --text-color: #2c3e50;
            --subtext-color: #666666;
            --border-color: #e2e8f0;

            --weekly-color: #0066cc;
            --weekly-hover: #004999;

            --button-bg: #f8fafc;
            --shadow-color: rgba(0, 0, 0, 0.06);
        }

        /* Dark Theme Colors */
        [data-theme="dark"] {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --nav-bg: #1e1e1e;
            --text-color: #e0e0e0;
            --subtext-color: #a0a0a0;
            --border-color: #333333;

            --weekly-color: #4da6ff;
            --weekly-hover: #80c1ff;

            --button-bg: #2a2a2a;
            --shadow-color: rgba(0, 0, 0, 0.4);
        }

        /* Global Reset */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            padding-bottom: 40px;
        }

        /* =========================================================
           NAVIGATION BAR
           ========================================================= */
        .navbar {
            background-color: var(--nav-bg);
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: 0 2px 8px var(--shadow-color);
        }

        .nav-container {
            max-width: 950px;
            margin: 0 auto;
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .nav-brand {
            font-weight: bold;
            font-size: 1.2rem;
            color: var(--weekly-color);
            text-decoration: none;
        }

        .nav-menu {
            display: flex;
            align-items: center;
            gap: 15px;
            list-style: none;
        }

        .nav-link {
            text-decoration: none;
            color: var(--text-color);
            font-weight: 500;
            font-size: 0.95rem;
            padding: 6px 10px;
            border-radius: 6px;
        }

        .nav-link:hover,
        .nav-link.active {
            color: var(--weekly-color);
            background-color: var(--button-bg);
        }

        .nav-controls {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* Dark Mode Toggle Button */
        .theme-toggle-btn {
            background: var(--button-bg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            font-size: 0.85rem;
            font-weight: 600;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .theme-toggle-btn:hover {
            border-color: var(--weekly-color);
        }

        /* Clean styling for Google Translate Dropdown */
        #google_translate_element select {
            background-color: var(--button-bg);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 6px 8px;
            border-radius: 6px;
            font-size: 0.85rem;
            cursor: pointer;
        }

        /* =========================================================
           MAIN CONTAINER & CONTENT CARD
           ========================================================= */
        .container {
            max-width: 700px;
            margin: 30px auto 0;
            padding: 0 15px;
        }

        .card {
            background: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            box-shadow: 0 4px 12px var(--shadow-color);
        }

        h1 {
            color: var(--weekly-color);
            font-size: 1.8rem;
            margin-bottom: 15px;
        }

        .back-link {
            display: inline-block;
            margin-bottom: 20px;
            color: var(--weekly-color);
            text-decoration: none;
            font-weight: 500;
            font-size: 0.9rem;
        }

        .back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <!-- TOP NAVIGATION BAR -->
    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="nav-brand">Grade 2 Hub</a>

            <ul class="nav-menu">
                <li><a href="index.html" class="nav-link">Home</a></li>
                <li><a href="about.html" class="nav-link active">About Me</a></li>
            </ul>

            <div class="nav-controls">
                <!-- Google Translate Dropdown Widget -->
                <div id="google_translate_element"></div>

                <!-- Dark Mode Toggle Button -->
                <button id="theme-toggle" class="theme-toggle-btn" aria-label="Toggle Dark Mode">Dark</button>
            </div>
        </div>
    </nav>

    <!-- MAIN CONTENT -->
    <div class="container">
        <div class="card">
            <a href="index.html" class="back-link">&larr; Return to Hub</a>
            <h1>Glen Pamment</h1>
            <p>Welcome to Grade 2! I am excited to partner with you and your child this school year.</p>
            <br>
            <p>Use this space to share a short bio, your teaching philosophy, or classroom contact info and office
                hours.</p>
        </div>
    </div>

    <!-- JAVASCRIPT FOR TRANSLATION AND DARK MODE TOGGLE -->
    <script type="text/javascript">
        function googleTranslateElementInit() {
            new google.translate.TranslateElement({
                pageLanguage: 'en',
                includedLanguages: 'zh-TW',
                layout: google.translate.TranslateElement.InlineLayout.SIMPLE
            }, 'google_translate_element');
        }
    </script>
    <script type="text/javascript"
        src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

    <script>
        const toggleBtn = document.getElementById('theme-toggle');
        const currentTheme = localStorage.getItem('theme');

        // Restore saved dark/light theme preference across pages
        if (currentTheme === 'dark') {
            document.documentElement.setAttribute('data-theme', 'dark');
            toggleBtn.textContent = 'Light';
        }

        toggleBtn.addEventListener('click', () => {
            let theme = document.documentElement.getAttribute('data-theme');
            if (theme === 'dark') {
                document.documentElement.setAttribute('data-theme', 'light');
                localStorage.setItem('theme', 'light');
                toggleBtn.textContent = 'Dark';
            } else {
                document.documentElement.setAttribute('data-theme', 'dark');
                localStorage.setItem('theme', 'dark');
                toggleBtn.textContent = 'Light';
            }
        });
    </script>
</body>

</html>
